// ── CUSTOMER 360° PROFILE PANEL ──
// One-screen POS-style customer view. Renders when the cashier taps a
// customer row (or the "Pull customer for order #" deep-lookup lands).
// Every number below comes from real Firestore docs — no fabrication —
// and every action either patches customers/{id} or writes a sibling
// audit row.
function CustomerOverview({ customer, allOrders, onBack, onReorder, onNewOrder, staff }) {
  const [tab, setTab] = React.useState("overview");
  const [notes, setNotes] = React.useState((customer && customer.notes) || []);
  const [noteDraft, setNoteDraft] = React.useState("");
  const [ledger, setLedger] = React.useState([]);
  const [liveOrders, setLiveOrders] = React.useState(null);
  const [live, setLive] = React.useState(customer || {});
  const [busy, setBusy] = React.useState("");
  const [editing, setEditing] = React.useState(false);
  const [editForm, setEditForm] = React.useState({
    name: (customer && customer.name) || "",
    email: (customer && customer.email) || "",
    dob: (customer && customer.dob) || "",
    lang: (customer && customer.lang) || "ar",
    prefBranch: (customer && customer.prefBranch) || "",
  });
  // Order-history filters — spec Phase 8.
  const [ordFilter, setOrdFilter] = React.useState({ scope: "all", status: "all", branch: "all", sort: "newest" });

  const idKey = (customer && (customer.id || customer.phone)) || "";
  const isOwner = staff && (staff.role === "owner" || staff.role === "admin");
  const isManagerPlus = isOwner || (staff && staff.role === "manager");

  // Real-time subscriptions — customer doc, ledger, and orders scoped to
  // this phone. Every open device sees the same numbers the moment a
  // Cloud Function commits a write.
  React.useEffect(() => {
    setLive(customer || {});
    setNotes((customer && customer.notes) || []);
    setEditForm({
      name: (customer && customer.name) || "",
      email: (customer && customer.email) || "",
      dob: (customer && customer.dob) || "",
      lang: (customer && customer.lang) || "ar",
      prefBranch: (customer && customer.prefBranch) || "",
    });
    if (!idKey || !window.FB) return;
    var unsubDoc = window.FB.onCustomerDoc
      ? window.FB.onCustomerDoc(idKey, function(d){
          if (!d) return;
          setLive(d);
          setNotes(Array.isArray(d.notes) ? d.notes : []);
        })
      : function(){};
    var unsubLed = window.FB.onCustomerLedger
      ? window.FB.onCustomerLedger(idKey, 40, setLedger)
      : function(){};
    var unsubOrd = (window.FB.onCustomerOrders && customer && customer.phone)
      ? window.FB.onCustomerOrders(customer.phone, setLiveOrders)
      : function(){};
    return function(){ try{ unsubDoc(); }catch(_){ } try{ unsubLed(); }catch(_){ } try{ unsubOrd(); }catch(_){ } };
  }, [customer && customer.id, customer && customer.phone]);

  // Every order for this customer, drawn from the already-live orders
  // stream. Cheaper than an extra fetch and stays fresh on every write.
  const myOrders = React.useMemo(() => {
    const ph = customer && customer.phone;
    if (!ph) return [];
    // Prefer the phone-scoped live stream when it's connected — it can see
    // rules-restricted orders the global stream skips, and it updates the
    // instant a fresh order lands at any branch.
    const src = Array.isArray(liveOrders) ? liveOrders : (allOrders || []);
    return src
      .filter(o => o.userPhone === ph)
      .sort((a, b) => {
        const at = (a.createdAt && a.createdAt.seconds) || (a.date ? Date.parse(a.date)/1000 : 0);
        const bt = (b.createdAt && b.createdAt.seconds) || (b.date ? Date.parse(b.date)/1000 : 0);
        return bt - at;
      });
  }, [allOrders, liveOrders, customer && customer.phone]);

  // Phase 4 stats — real numbers from real orders.
  const stats = React.useMemo(() => {
    const s = { total: 0, completed: 0, cancelled: 0, refunded: 0, spent: 0, first: null, last: null, coupons: 0 };
    myOrders.forEach(o => {
      s.total++;
      const st = String(o.status || "").toLowerCase();
      if (st === "done" || st === "ready" || st === "completed") s.completed++;
      if (st === "cancelled" || st === "declined") s.cancelled++;
      if (o.refund && Number(o.refund.amount) > 0) s.refunded++;
      s.spent += Number(o.total) || 0;
      if (o.couponCode) s.coupons++;
      const t = (o.createdAt && o.createdAt.seconds ? o.createdAt.seconds*1000 : (o.date ? Date.parse(o.date) : 0));
      if (t) {
        if (!s.first || t < s.first) s.first = t;
        if (!s.last  || t > s.last)  s.last  = t;
      }
    });
    s.avg = s.total ? s.spent / s.total : 0;
    return s;
  }, [myOrders]);

  // Phase 10 — branch history.
  const byBranch = React.useMemo(() => {
    const m = {};
    myOrders.forEach(o => {
      const b = o.branch || "unknown";
      if (!m[b]) m[b] = { branch: b, count: 0, spent: 0, name: (o.branchObj && (o.branchObj.nameEn || o.branchObj.id)) || b };
      m[b].count++;
      m[b].spent += Number(o.total) || 0;
    });
    return Object.values(m).sort((a,b) => b.count - a.count);
  }, [myOrders]);

  // Phase 9 — favorites (from item history).
  const favorites = React.useMemo(() => {
    const m = {};
    myOrders.forEach(o => (o.items || []).forEach(it => {
      const k = it.name || "";
      if (!m[k]) m[k] = { name: k, orders: 0, qty: 0 };
      m[k].orders++;
      m[k].qty += (it.qty || 1);
    }));
    return Object.values(m).sort((a,b) => b.orders - a.orders).slice(0, 10);
  }, [myOrders]);

  // Phase 11 — payment mix.
  const byPayment = React.useMemo(() => {
    const m = {};
    myOrders.forEach(o => {
      const p = o.paymentMethod || "cash";
      if (!m[p]) m[p] = { method: p, count: 0, spent: 0 };
      m[p].count++;
      m[p].spent += Number(o.total) || 0;
    });
    return Object.values(m);
  }, [myOrders]);

  // Phase 17 — behavior analytics.
  const behavior = React.useMemo(() => {
    if (!myOrders.length) return null;
    const spanDays = stats.first && stats.last ? Math.max(1, (stats.last - stats.first) / 86400000) : 1;
    const freqPerWeek = (stats.total / spanDays) * 7;
    const daysSince = stats.last ? Math.floor((Date.now() - stats.last) / 86400000) : null;
    // Bucket typical ordering hour.
    const hours = {};
    myOrders.forEach(o => {
      const t = (o.createdAt && o.createdAt.seconds ? o.createdAt.seconds*1000 : (o.date ? Date.parse(o.date) : 0));
      if (!t) return;
      const h = new Date(t).getHours();
      hours[h] = (hours[h] || 0) + 1;
    });
    let peakH = null, peakN = 0;
    Object.entries(hours).forEach(([h, n]) => { if (n > peakN) { peakN = n; peakH = Number(h); } });
    const cancelRate = stats.total ? (stats.cancelled / stats.total) : 0;
    return { freqPerWeek: freqPerWeek, daysSince: daysSince, peakH: peakH, cancelRate: cancelRate, favProduct: favorites[0] };
  }, [myOrders, favorites, stats]);

  // Phase 12 — loyalty snapshot. Points prefer server ledger mirror.
  const points   = Number((live.points != null ? live.points : live.loyaltyPoints) || 0);
  const lifetimeSpend  = Number(live.lifetimeSpend || 0);
  const tierName = live.tierName || (live.tier && live.tier.tierName) || "Bronze";
  const tierMult = Number(live.tierMult || (live.tier && live.tier.tierMult) || 1);
  const nextTierMin = Number(live.nextTierMin || (live.tier && live.tier.nextTierMin) || 0);
  const nextTierName = live.nextTierName || (live.tier && live.tier.nextTierName) || "";

  // Phase 18 — alerts.

// ── ANALYTICS TAB ──
function AnalyticsTabNew({ orders }) {
  const today = new Date();

  // Build last 30 days data
  const days = [];
  for (let i = 29; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toDateString();
    const dayOrders = orders.filter(o => new Date(o.date).toDateString() === dateStr);
    const revenue = dayOrders.reduce((s, o) => {
      const vat = o.vat || Math.round((o.total||0) / 1.15 * 0.15 * 100) / 100;
      const pFee = o.platformFee || 0;
      const dFee = o.deliveryFee || 0;
      return s + vat + pFee + dFee;
    }, 0);
    const totalSale = dayOrders.reduce((s, o) => {
      const vat = o.vat || Math.round((o.total||0) / 1.15 * 0.15 * 100) / 100;
      const pFee = o.platformFee || 0;
      const dFee = o.deliveryFee || 0;
      return s + (o.total||0) - vat - pFee - dFee;
    }, 0);
    days.push({
      label: d.toLocaleDateString("en", { month: "short", day: "numeric" }),
      orders: dayOrders.length,
      revenue: revenue,
      date: dateStr,
      isToday: i === 0
    });
  }

  const totalOrders = orders.length;
  const totalRevenue = orders.reduce((s, o) => {
    const vat = o.vat || Math.round((o.total||0)/1.15*0.15*100)/100;
    const pFee = o.platformFee || 0;
    const dFee = o.deliveryFee || 0;
    return s + vat + pFee + dFee;
  }, 0);
  const totalSaleAll = orders.reduce((s, o) => {
    const vat = o.vat || Math.round((o.total||0)/1.15*0.15*100)/100;
    const pFee = o.platformFee || 0;
    const dFee = o.deliveryFee || 0;
    return s + (o.total||0) - vat - pFee - dFee;
  }, 0);
  const todayOrders = days[days.length - 1].orders;
  const todayRevenue = days[days.length - 1].revenue;
  const last7Revenue = days.slice(-7).reduce((s, d) => s + d.revenue, 0);
  const last30Revenue = days.reduce((s, d) => s + d.revenue, 0);

  const maxRevenue = Math.max(...days.map(d => d.revenue), 1);
  const maxOrders = Math.max(...days.map(d => d.orders), 1);

  const [chartMode, setChartMode] = React.useState("revenue"); // revenue | orders

  // Top items
  const itemCounts = {};
  orders.forEach(o => (o.items || []).forEach(i => {
    itemCounts[i.name] = (itemCounts[i.name] || 0) + i.qty;
  }));
  const topItems = Object.entries(itemCounts).sort((a, b) => b[1] - a[1]).slice(0, 5);

  // Payment breakdown
  const payments = {};
  orders.forEach(o => { payments[o.paymentMethod || "cash"] = (payments[o.paymentMethod || "cash"] || 0) + 1; });

  // Branch breakdown
  const branches = {};
  orders.forEach(o => { branches[o.branch || "unknown"] = (branches[o.branch || "unknown"] || 0) + 1; });

  return React.createElement("div", null,
    // Stats grid
    React.createElement("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20 } },
      React.createElement(StatCard, { icon: "📦", label: "Today Orders", value: todayOrders, color: "#E60000" }),

// ════════════════════════════════════════════════════════════
//  REPORTS TAB — full-featured, multi-report, multi-filter
// ════════════════════════════════════════════════════════════
function ReportsTabNew({ orders, branches, scopedBranchId }) {
  const isScoped = !!scopedBranchId;
  const REPORT_TYPES = [
    { id: "summary",    ico: "📊", label: "Sales Summary" },
    { id: "shift",      ico: "🧑‍🍳", label: "Shift Close (Z)" },
    { id: "items",      ico: "🍗", label: "Item Sales" },
    { id: "categories", ico: "🗂️", label: "Categories" },
    { id: "customers",  ico: "👥", label: "Customers" },
    { id: "hourly",     ico: "🕒", label: "Hourly Heatmap" },
    { id: "compare",    ico: "⚖️", label: "Compare Periods" },
    { id: "log",        ico: "🧾", label: "Transactions Log" },
  ];
  const PRESETS = [
    { id: "today", label: "Today" },
    { id: "yesterday", label: "Yesterday" },
    { id: "7", label: "Last 7d" },
    { id: "30", label: "Last 30d" },
    { id: "thisMonth", label: "This Month" },
    { id: "lastMonth", label: "Last Month" },
    { id: "thisYear", label: "This Year" },
    { id: "all", label: "All Time" },
    { id: "custom", label: "Custom" },
  ];

  const iso = d => d.toISOString().slice(0, 10);
  const today0 = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };

  const [reportType, setReportType] = React.useState("summary");
  const [preset, setPreset]         = React.useState("30");
  const [fromDate, setFromDate]     = React.useState(iso(new Date(Date.now() - 29 * 86400000)));
  const [toDate, setToDate]         = React.useState(iso(new Date()));
  const [branchSel, setBranchSel]   = React.useState(scopedBranchId ? [scopedBranchId] : branches.map(b => b.id));
  const [typeSel, setTypeSel]       = React.useState(["pickup", "delivery"]);
  const [paySel, setPaySel]         = React.useState(["cash", "prepaid"]);
  const [statusSel, setStatusSel]   = React.useState(["new", "preparing", "cooking", "almost_ready", "ready", "done"]);
  const [minAmt, setMinAmt]         = React.useState("");
  const [maxAmt, setMaxAmt]         = React.useState("");
  const [search, setSearch]         = React.useState("");
  const [groupBy, setGroupBy]       = React.useState("day");
  const [showFilters, setShowFilters] = React.useState(true);
  const [report, setReport]         = React.useState(null);
  const [genAt, setGenAt]           = React.useState(null);

  React.useEffect(() => {
    if (isScoped) setBranchSel([scopedBranchId]);
  }, [scopedBranchId, isScoped]);

  React.useEffect(() => { computeDateRangeFromPreset(preset); }, [preset]);
  function computeDateRangeFromPreset(p) {
    if (p === "custom") return;
    const t = today0(); let f = new Date(t), to = new Date(t);
    if (p === "today")      { }
    else if (p === "yesterday") { f = new Date(t); f.setDate(f.getDate() - 1); to = new Date(f); }
    else if (p === "7")     { f = new Date(t); f.setDate(f.getDate() - 6); }
    else if (p === "30")    { f = new Date(t); f.setDate(f.getDate() - 29); }
    else if (p === "thisMonth") { f = new Date(t.getFullYear(), t.getMonth(), 1); }
    else if (p === "lastMonth") { f = new Date(t.getFullYear(), t.getMonth() - 1, 1); to = new Date(t.getFullYear(), t.getMonth(), 0); }
    else if (p === "thisYear")  { f = new Date(t.getFullYear(), 0, 1); }
    else if (p === "all")   { f = new Date(2000, 0, 1); }
    setFromDate(iso(f)); setToDate(iso(to));
  }

  const money = n => "SR " + (n || 0).toFixed(2);
  const branchName = id => { const b = branches.find(x => x.id === id); return b ? b.name : (id || "Unknown"); };

  // ─── multi-toggle helper ───
  const toggleIn = (arr, v) => arr.includes(v) ? arr.filter(x => x !== v) : arr.concat([v]);

  // ─── FILTER ORDERS ───
  function applyFilters(list) {
    const from = new Date(fromDate + "T00:00:00");
    const to = new Date(toDate + "T23:59:59");
    const s = search.trim().toLowerCase();
    const mn = parseFloat(minAmt), mx = parseFloat(maxAmt);
    return list.filter(o => {
      const d = new Date(o.date); if (isNaN(d)) return false;
      if (d < from || d > to) return false;
      if (branchSel.length && !branchSel.includes(o.branch)) return false;
      if (typeSel.length && !typeSel.includes(o.orderType || "pickup")) return false;
      if (paySel.length && !paySel.includes(o.paymentMethod || "cash")) return false;
      if (statusSel.length && !statusSel.includes(o.status || "new")) return false;
      const total = o.total || 0;
      if (!isNaN(mn) && total < mn) return false;
      if (!isNaN(mx) && total > mx) return false;
      if (s) {
        const hay = ((o.orderNo || "") + " " + (o.userName || "") + " " + (o.userPhone || "")).toLowerCase();
        if (hay.indexOf(s) === -1) return false;
      }
      return true;
    });
  }

  function bucketKey(d) {
    if (groupBy === "day")   return d.toLocaleDateString("en-GB");
    if (groupBy === "week")  { const t = new Date(d); const day = (t.getDay() + 6) % 7; t.setDate(t.getDate() - day); return "Wk " + t.toLocaleDateString("en-GB"); }
    if (groupBy === "month") return d.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
    return d.toLocaleDateString("en-GB");
  }

  // ─── METRICS ───
  function metricsFor(list) {
    const m = { count: list.length, gross: 0, net: 0, vat: 0, pFee: 0, dFee: 0,
      pickup: 0, delivery: 0, pickupRev: 0, deliveryRev: 0,
      pay: { cash: 0, prepaid: 0 }, status: { new: 0, preparing: 0, cooking: 0, almost_ready: 0, ready: 0, done: 0 },
      items: {}, buckets: {}, hourly: {}, dow: {}, customers: {}, branch: {} };
    list.forEach(o => {
      const total = o.total || 0;
      const vat = o.vat || Math.round(total / 1.15 * 0.15 * 100) / 100;
      const pFee = o.platformFee || 0, dFee = o.deliveryFee || 0;
      const net = total - vat - pFee - dFee;
      m.gross += total; m.vat += vat; m.pFee += pFee; m.dFee += dFee; m.net += net;
      if (o.orderType === "delivery") { m.delivery++; m.deliveryRev += total; } else { m.pickup++; m.pickupRev += total; }
      const pm = o.paymentMethod || "cash"; m.pay[pm] = (m.pay[pm] || 0) + 1;
      const st = o.status || "new"; m.status[st] = (m.status[st] || 0) + 1;
      (o.items || []).forEach(it => {
        const k = it.name || "Unknown";
        if (!m.items[k]) m.items[k] = { qty: 0, rev: 0, orders: 0 };
        m.items[k].qty += (it.qty || 0);
        m.items[k].rev += (it.price || 0) * (it.qty || 0);
        m.items[k].orders++;
      });
      const d = new Date(o.date);
      const bk = bucketKey(d);
      if (!m.buckets[bk]) m.buckets[bk] = { orders: 0, gross: 0, sortKey: d.getTime() };
      m.buckets[bk].orders++; m.buckets[bk].gross += total;
      const hk = d.getHours(); const dowK = (d.getDay() + 6) % 7; // Mon=0
      const cellK = dowK + "_" + hk;
      m.hourly[cellK] = (m.hourly[cellK] || 0) + 1;
      m.dow[dowK] = (m.dow[dowK] || 0) + 1;
      const ph = (o.userPhone || "").trim();
      if (ph) {
        if (!m.customers[ph]) m.customers[ph] = { name: o.userName || "", phone: ph, orders: 0, spent: 0, firstDate: d, lastDate: d };
        m.customers[ph].orders++;
        m.customers[ph].spent += total;
        if (d < m.customers[ph].firstDate) m.customers[ph].firstDate = d;
        if (d > m.customers[ph].lastDate) m.customers[ph].lastDate = d;
      }
      const bId = o.branch || "unknown";
      if (!m.branch[bId]) m.branch[bId] = { count: 0, gross: 0, net: 0 };
      m.branch[bId].count++; m.branch[bId].gross += total; m.branch[bId].net += net;
    });
    m.avg = m.count ? m.gross / m.count : 0;
    m.topItems    = Object.entries(m.items).map(([n, v]) => ({ name: n, qty: v.qty, rev: v.rev, orders: v.orders })).sort((a, b) => b.rev - a.rev);
    m.bucketList  = Object.entries(m.buckets).map(([k, v]) => ({ label: k, orders: v.orders, gross: v.gross, sortKey: v.sortKey })).sort((a, b) => a.sortKey - b.sortKey);
    m.customerList = Object.values(m.customers).sort((a, b) => b.spent - a.spent);
    m.busiest     = m.bucketList.slice().sort((a, b) => b.gross - a.gross)[0] || null;
    return m;
  }

  function generate() {
    const filtered = applyFilters(orders);
    const overall = metricsFor(filtered);
    // For compare: previous equal-length window
    let compareData = null;
    if (reportType === "compare" && preset !== "custom" && preset !== "all") {
      const from = new Date(fromDate + "T00:00:00");
      const to = new Date(toDate + "T23:59:59");
      const len = to - from;
      const prevTo = new Date(from.getTime() - 1);
      const prevFrom = new Date(prevTo.getTime() - len);
      const prevList = orders.filter(o => {
        const d = new Date(o.date); if (isNaN(d)) return false;
        if (d < prevFrom || d > prevTo) return false;
        if (branchSel.length && !branchSel.includes(o.branch)) return false;
        return true;
      });
      compareData = { prevFrom: prevFrom, prevTo: prevTo, m: metricsFor(prevList) };
    }
    setReport({ filtered, overall, compareData, filters: { fromDate, toDate, branchSel, typeSel, paySel, statusSel, minAmt, maxAmt, search, groupBy, preset, reportType } });
    setGenAt(new Date());
  }

  function resetFilters() {
    setPreset("30");
    setBranchSel(isScoped ? [scopedBranchId] : branches.map(b => b.id));
    setTypeSel(["pickup", "delivery"]); setPaySel(["cash", "prepaid"]);
    setStatusSel(["new", "preparing", "cooking", "almost_ready", "ready", "done"]);
    setMinAmt(""); setMaxAmt(""); setSearch(""); setGroupBy("day");
  }

  // ─── EXCEL EXPORT ───
  function downloadExcel() {
    if (!report) return;
    if (typeof XLSX === "undefined") { alert("Export library not loaded. Reload and try again."); return; }
    const o = report.overall;
    const wb = XLSX.utils.book_new();
    const summary = [
      { Metric: "Report", Value: "Broast Albahr — " + (REPORT_TYPES.find(t => t.id === reportType) || { label: "" }).label },
      { Metric: "From", Value: fromDate }, { Metric: "To", Value: toDate },
      { Metric: "Branches", Value: branchSel.map(branchName).join(", ") },
      { Metric: "Types", Value: typeSel.join(", ") },
      { Metric: "Payments", Value: paySel.join(", ") },
      { Metric: "Statuses", Value: statusSel.join(", ") },
      { Metric: "Search", Value: search || "-" },
      { Metric: "Generated", Value: new Date().toLocaleString("en-GB") },
      { Metric: "", Value: "" },
      { Metric: "Orders", Value: o.count },
      { Metric: "Gross (SR)", Value: o.gross.toFixed(2) },
      { Metric: "Net (SR)", Value: o.net.toFixed(2) },
      { Metric: "VAT (SR)", Value: o.vat.toFixed(2) },
      { Metric: "Delivery Fees (SR)", Value: o.dFee.toFixed(2) },
      { Metric: "Avg Order (SR)", Value: o.avg.toFixed(2) },
    ];
    const wsS = XLSX.utils.json_to_sheet(summary); wsS["!cols"] = [{ wch: 22 }, { wch: 40 }];
    XLSX.utils.book_append_sheet(wb, wsS, "Summary");

    const byBranch = Object.entries(o.branch).map(([id, v]) => ({ Branch: branchName(id), Orders: v.count, "Gross (SR)": v.gross.toFixed(2), "Net (SR)": v.net.toFixed(2) }));

    //   size = module dot size 1..16 (8 ≈ 45mm across on 80mm paper)
    //   ec   = error correction: 48=L, 49=M (default), 50=Q, 51=H
    function escposQR(data, size, ec) {
      if (data == null) return "";

      out += GS + "(k\x03\x00\x31\x43" + String.fromCharCode(sz);
      // Error correction: cn=49, fn=69, n=level
      out += GS + "(k\x03\x00\x31\x45" + String.fromCharCode(el);
      // Store data: cn=49, fn=80, m=48, then payload
      var len = bytes.length + 3;
      var pL = len & 0xFF, pH = (len >> 8) & 0xFF;
      out += GS + "(k" + String.fromCharCode(pL) + String.fromCharCode(pH) + "\x31\x50\x30" + bytes;
      // Print: cn=49, fn=81, m=48
      out += GS + "(k\x03\x00\x31\x51\x30";

      lines.push(NORMAL);
      lines.push(CENTER + w("Header", stripEmoji((C.header || "").toUpperCase())) + LF);
      if (C.tagline) lines.push(CENTER + w("Tagline", stripEmoji(C.tagline)) + LF);
      if (C.showBranchName && branchName) lines.push(CENTER + w("BranchName", stripEmoji(branchName + (C.branchSuffix || ""))) + LF);
      lines.push(LEFT + line("="));

      // Header contact — printed near the top so the kitchen line can call
      // the ordering branch without hunting.
      if (C.showBranchContact && branchPhone) {
        lines.push(CENTER + "Tel " + stripEmoji(branchPhone) + LF);
      }

      // Order details. Order number gets the biggest text on the paper —
      // sized via the OrderNo style so admin can dial it up/down.
      if (C.showOrderNo) {
        lines.push(CENTER + w("OrderNo", "#" + stripEmoji(order.orderNo)) + LF + LEFT);
      }
      if (C.showType) lines.push(w("Labels", "Type:") + "   " + (order.orderType === "pickup" ? "Pickup" : "Delivery") + LF);
      if (C.showStatus && order.status) lines.push(w("Labels", "Status:") + " " + stripEmoji(order.status) + LF);
      if (C.showDate) lines.push(w("Labels", "Placed:") + " " + dateStr + " " + timeStr + LF);
      if (C.showReadyBy) lines.push(w("Labels", "Ready:") + "  " + readyStr + " (~" + prepMin + " min)" + LF);
      if (order.pickupTime) lines.push(w("Labels", "Pickup:") + " " + stripEmoji(order.pickupTime) + LF);
      lines.push(LEFT + line("-"));

      // Customer
      if (C.showCustomer) {
        lines.push(w("Labels", "Customer") + LF);
        // Name on its own line — style-configurable so the kitchen can size
        // it up when the pass is far from the printer.
        lines.push(w("CustomerName", stripEmoji(order.userName || "Customer")) + LF);
        if (C.showPhone && order.userPhone) lines.push(w("Labels", "Phone:") + "  " + stripEmoji(order.userPhone) + LF);
        if (C.showPayment) lines.push(w("Labels", "Pay:") + "    " + stripEmoji(order.paymentMethod || "cash") + LF);
        if (C.showLocation && order.orderType === "delivery" && order.locationLink) {
          lines.push(w("Labels", "Location:") + LF);
          lines.push(order.locationLink.substring(0, W) + LF);
        }
        lines.push(LEFT + line("-"));
      }

      // REFUNDED / CANCELLED banner — mounted before ITEMS so a re-print
      // never hides the fact that this order is no longer a live one.
      if (order.refund && Number(order.refund.amount) > 0) {
        lines.push(CENTER + TALL + BOLD_ON + "*** REFUNDED ***" + BOLD_OFF + LF + NORMAL);
        lines.push(CENTER + "SR " + Number(order.refund.amount).toFixed(2) + LF);
        if (order.refund.reason) lines.push(CENTER + stripEmoji(order.refund.reason) + LF);
        lines.push(line("-"));
      } else if (String(order.status || "").toLowerCase() === "cancelled") {
        lines.push(CENTER + TALL + BOLD_ON + "*** CANCELLED ***" + BOLD_OFF + LF + NORMAL);
        if (order.declineReason) lines.push(CENTER + stripEmoji(order.declineReason) + LF);
        lines.push(line("-"));
      }

      // Items
      if (C.showItems) {
        lines.push(CENTER + w("Labels", "ITEMS") + LF);
        lines.push(line("-"));
        (order.items || []).forEach(function (item) {
          var name = stripEmoji(item.name || "");
          var qty = item.qty || 1;
          // Phase 6: prefer the persisted lineTotal (which already accounts
          // for any per-line comp) and fall back to price*qty for legacy rows.
          var lineTotal = (typeof item.lineTotal === "number") ? item.lineTotal : (item.price || 0) * qty;
          var price = "SR " + Number(lineTotal).toFixed(2);
          // Name + qty at the ItemName/ItemQty sizes, note at ItemNote size,
          // price at ItemPrice — all four are independently configurable.
          lines.push(w("ItemName", name) + LF);
          if (C.showItemArabic && item.nameAr) lines.push("  " + stripEmoji(item.nameAr) + LF);
          lines.push(w("ItemQty", "  x" + qty) + LF);
          lines.push(open("ItemPrice") + pad("", price) + close("ItemPrice") + LF);
          // Menu-vs-app "was" annotation when the counter price is set higher
          // than the app price — Phase 6 lineMenuValue tells us what the
          // walk-in customer would have paid at the counter.
          var menuVal = (typeof item.lineMenuValue === "number") ? item.lineMenuValue
                       : (Number(item.menuPrice) > 0 ? Number(item.menuPrice) * qty : 0);
          if (menuVal > lineTotal + 0.005) {
            lines.push(pad("", "(was SR " + Number(menuVal).toFixed(2) + ")") + LF);
          }
          if (item.note) lines.push(w("ItemNote", "  >> " + stripEmoji(item.note)) + LF);
        });
        lines.push(line("-"));
        if (subtotal != null) lines.push(pad("Subtotal", "SR " + subtotal.toFixed(2)) + LF);
        // Phase 6 app-savings: only surface when it's non-zero so ordinary
        // orders don't print a "0.00" line.
        var appDiscount = (order.totals && typeof order.totals.appDiscount === "number")
          ? Number(order.totals.appDiscount) : 0;
        if (appDiscount > 0) lines.push(pad("App savings", "-SR " + appDiscount.toFixed(2)) + LF);
        if (order.platformFee) lines.push(pad("Platform Fee", "SR " + Number(order.platformFee).toFixed(2)) + LF);
        if (order.deliveryFee) lines.push(pad("Delivery Fee", "SR " + Number(order.deliveryFee).toFixed(2)) + LF);
        if (discount) lines.push(pad("Discount", "-SR " + discount.toFixed(2)) + LF);
        if (order.couponCode) lines.push(pad("Coupon", stripEmoji(order.couponCode)) + LF);
        if (order.refund && Number(order.refund.amount) > 0) {
          lines.push(pad("Refund", "-SR " + Number(order.refund.amount).toFixed(2)) + LF);
        }
        // TALL keeps normal character width, so pad()'s alignment survives
        // even though every char is now twice as tall.
        lines.push(open("TotalLabel") + pad("TOTAL", "SR " + total.toFixed(2)) + close("TotalLabel") + LF);
        var inclVat = order.vat || Math.round(total / 1.15 * 0.15 * 100) / 100;
        lines.push(CENTER + "(Prices incl. 15% VAT: SR " + inclVat.toFixed(2) + ")" + LF);
        lines.push(line("="));
      }

      // Phase 11 reward slot — Phase 10/11 stamps order.reward on eligible
      // orders. Reserving the block now so the kitchen ticket layout doesn't
      // change when rewards ship. Silent when absent.
      // The QR carries the opaque token only (never the discount value) so
      // customers can scan-to-redeem at their next visit; the code below it
      // is a manual fallback for damaged prints.
      if (order.reward && order.reward.code) {
        lines.push(CENTER + w("Labels", "REWARD CODE") + LF);
        lines.push(CENTER + escposQR(order.reward.code, QR_SIZE, 50) + LF);
        lines.push(CENTER + w("Reward", stripEmoji(order.reward.code)) + LF);
        if (order.reward.label) lines.push(CENTER + stripEmoji(order.reward.label) + LF);
        lines.push(CENTER + "Scan to redeem" + LF);
        lines.push(LEFT + line("-"));
      } else if (order.couponCode) {
        // Coupon applied to this order — reprint it as a scannable QR so the
        // counter can verify at hand-off without the customer typing the code.
        lines.push(CENTER + w("Labels", "COUPON") + LF);
        lines.push(CENTER + escposQR(order.couponCode, Math.max(1, QR_SIZE - 1), 50) + LF);
        lines.push(CENTER + w("Reward", stripEmoji(order.couponCode)) + LF);
        lines.push(LEFT + line("-"));
      }

      // Order-level note (customer's "any special request" from checkout)
      if (order.note) {
        lines.push(w("Labels", "Note:") + " " + (C.italicNote ? ITALIC_ON : "") + stripEmoji(order.note) + (C.italicNote ? ITALIC_OFF : "") + LF);
        lines.push(LEFT + line("-"));
      }

      // Loyalty — earned this order + total running balance from the customer doc.
      if (C.showLoyalty) {
        lines.push(CENTER + w("Labels", stripEmoji(C.loyaltyLabel || "Loyalty Points")) + LF);
        if (order.loyaltyTierName) {
          lines.push(CENTER + "Tier: " + stripEmoji(order.loyaltyTierName) +
            (tierMult && tierMult !== 1 ? " (x" + tierMult + ")" : "") + LF);
        }
        lines.push(CENTER + "Earned this order: +" + pts + " pts" + LF);
        if (C.showLoyaltyBalance && order.loyaltyBalance != null) {
          lines.push(CENTER + "Total balance: " + Number(order.loyaltyBalance) + " pts" + LF);
        }
        // Per-customer QR — encodes the phone so the counter can scan the
        // ticket to open the right customer, and so a future in-store kiosk
        // can credit or redeem against the correct account. Prints on every
        // receipt that has a phone, independently of the reward/coupon QR.
        if (order.userPhone) {
          lines.push(CENTER + escposQR("cust:" + String(order.userPhone), Math.max(1, QR_SIZE - 2), 50) + LF);
          lines.push(CENTER + stripEmoji(order.userPhone) + LF);
        }
        lines.push(LEFT + line("-"));
      }

      // Tax IDs
      if (C.showTaxNumber && C.taxNumber) lines.push(w("Labels", "Tax#:") + " " + stripEmoji(C.taxNumber) + LF);
      if (C.showVatNumber && C.vatNumber) lines.push(w("Labels", "VAT#:") + " " + stripEmoji(C.vatNumber) + LF);
      if ((C.showTaxNumber && C.taxNumber) || (C.showVatNumber && C.vatNumber)) lines.push(LEFT + line("-"));

      // Contact block
      if (C.showBranchPhones) {
        lines.push(CENTER + w("Contact", stripEmoji(C.contactHeader || "Contact Us")) + LF);
        (C.contactLines || []).forEach(function (l) { if (l) lines.push(CENTER + open("Contact") + stripEmoji(l) + close("Contact") + LF); });
        lines.push(LEFT + line("="));
      }

      // Promo (italic-configurable)
      if (C.promoLine) {
        lines.push(CENTER + (C.italicPromo ? ITALIC_ON : "") + stripEmoji(C.promoLine) + (C.italicPromo ? ITALIC_OFF : "") + LF);
        lines.push(LEFT + line("-"));
      }

      // Footer
      if (C.footerLine1) lines.push(CENTER + w("Footer", stripEmoji(C.footerLine1)) + LF);
      if (C.footerLine2) lines.push(CENTER + open("Footer") + stripEmoji(C.footerLine2) + close("Footer") + LF);
      if (C.footerLine3) lines.push(CENTER + open("Footer") + stripEmoji(C.footerLine3) + close("Footer") + LF);

      var feed = Math.max(1, Number(C.feedLines) || 3);
      lines.push(LF.repeat(feed));
      if (C.autoCut !== false) lines.push(CUT);

      return lines.join("");
    }

    // ── Build ESC/POS KITCHEN ticket ─────────────────────────
    // Minimal pass-line ticket the line cook actually needs: order #, when
    // it landed, order type, and every item with its quantity + note.
    // Nothing else — no prices, no loyalty, no QR. Uses the same paper
    // width + auto-cut settings as the customer receipt so the same paper
    // roll works, but has its own printer target (kitchenPrinterFor).
    function buildKitchenReceipt(order, cfgOverride) {
      var C = resolveConfig(order.branch, cfgOverride);
      var ESC = "\x1B", GS = "\x1D", LF = "\n";
      var BOLD_ON = ESC + "E\x01", BOLD_OFF = ESC + "E\x00";
      var CENTER = ESC + "a\x01", LEFT = ESC + "a\x00";
      var NORMAL = GS + "!\x00", TALL = GS + "!\x10", BIG = GS + "!\x11", HUGE = GS + "!\x22";
      var CUT = GS + "V\x42\x00";
      var W = Math.max(24, Math.min(64, Number(C.paperWidth) || 32));
      function line(ch) { return ch.repeat(W) + LF; }
      function pad(l, r) { var g = W - l.length - r.length; if (g < 1) g = 1; return l + " ".repeat(g) + r; }

      var orderTs = null;
      if (order.createdAt && typeof order.createdAt.toDate === "function") orderTs = order.createdAt.toDate();
      else if (order.date) { var t = new Date(order.date); if (!isNaN(t.getTime())) orderTs = t; }
      if (!orderTs) orderTs = new Date();
      var timeStr = orderTs.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      var dateStr = orderTs.toLocaleDateString("en-GB");

      var branchMap = { kakkiyah: "Kakkiyah", subhani: "Subhani", waliy: "Waliy Al Ahd" };
      var branchName = branchMap[order.branch] || (order.branchObj && (order.branchObj.nameEn || order.branchObj.id)) || order.branch || "";

      var out = [];
      out.push(NORMAL);
      out.push(CENTER + BOLD_ON + TALL + "KITCHEN" + NORMAL + BOLD_OFF + LF);
      if (branchName) out.push(CENTER + stripEmoji(branchName) + LF);
      out.push(LEFT + line("="));
      // Order number — biggest thing on the ticket so the cook can read it
      // from across the pass without picking up the paper.
      out.push(CENTER + HUGE + BOLD_ON + "#" + stripEmoji(order.orderNo || "") + BOLD_OFF + NORMAL + LF);
      out.push(LEFT + line("-"));
      out.push(BOLD_ON + "Type: " + BOLD_OFF + (order.orderType === "pickup" ? "Pickup" : "Delivery") + LF);
      out.push(BOLD_ON + "Placed: " + BOLD_OFF + dateStr + " " + timeStr + LF);
      var prepMin = order.orderType === "delivery"
        ? Number(C.prepMinutesDelivery) || 30
        : Number(C.prepMinutesPickup) || 15;
      var readyStr = new Date(orderTs.getTime() + prepMin * 60000).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      out.push(BOLD_ON + "Ready: " + BOLD_OFF + readyStr + " (~" + prepMin + " min)" + LF);
      out.push(LEFT + line("="));

      // Items — name in BIG on its own line, qty on the right in HUGE so
      // the cook can count at a glance. Note (if any) below in normal.
      (order.items || []).forEach(function (item) {
        var name = stripEmoji(item.name || "");
        var qty = "x" + (item.qty || 1);
        out.push(BIG + BOLD_ON + name + BOLD_OFF + NORMAL + LF);
        out.push(pad("", HUGE + BOLD_ON + qty + BOLD_OFF + NORMAL) + LF);
        if (item.note) out.push("  >> " + stripEmoji(item.note) + LF);
        out.push(LEFT + line("-"));
      });

      // Order-wide note (e.g. "extra sauce for everything")
      if (order.note) {
        out.push(BOLD_ON + "NOTE: " + BOLD_OFF + stripEmoji(order.note) + LF);
        out.push(LEFT + line("-"));
      }

      var feed = Math.max(1, Number(C.feedLines) || 3);
      out.push(LF.repeat(feed));
      if (C.autoCut !== false) out.push(CUT);
      return out.join("");
    }

    // ── Build KITCHEN HTML (for live preview + browser fallback) ─
    function buildKitchenReceiptHTML(order, cfgOverride) {
      var C = resolveConfig(order.branch, cfgOverride);
      var branchMap = { kakkiyah: "Kakkiyah", subhani: "Subhani", waliy: "Waliy Al Ahd" };
      var branchName = branchMap[order.branch] || (order.branchObj && (order.branchObj.nameEn || order.branchObj.id)) || order.branch || "";
      var d = null;
      if (order.createdAt && typeof order.createdAt.toDate === "function") d = order.createdAt.toDate();
      else if (order.date) { var _t = new Date(order.date); if (!isNaN(_t.getTime())) d = _t; }
      if (!d) d = new Date();
      var when = d.toLocaleDateString("en-GB") + " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      var prepMin = order.orderType === "delivery" ? Number(C.prepMinutesDelivery) || 30 : Number(C.prepMinutesPickup) || 15;
      var readyBy = new Date(d.getTime() + prepMin * 60000).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      var basePx = Math.max(11, Math.min(30, Number(C.fontHtmlPx) || 15));
      function esc(s){ return stripEmoji(String(s == null ? "" : s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

      var items = (order.items || []).map(function (it) {
        var noteHTML = it.note ? "<div style='font-size:" + Math.round(basePx*0.9) + "px'>&gt;&gt; " + esc(it.note) + "</div>" : "";
        return "<div class='item'>" +
          "<div class='iname'>" + esc(it.name || "") + "</div>" +
          "<div class='iqty'>x" + (it.qty || 1) + "</div>" +
          noteHTML +
          "</div>";
      }).join("");

      return "<!doctype html><html><head><meta charset='utf-8'/><title>Kitchen #" + esc(order.orderNo) + "</title>" +
        "<style>" +
        "@page{size:72mm auto;margin:0}" +
        "html,body{margin:0;padding:0;background:#fff;color:#000;font-family:'VT323','Courier Prime','Courier New','Consolas',monospace;font-size:" + basePx + "px;line-height:1.15;width:72mm;font-weight:700;-webkit-font-smoothing:none;font-smooth:never}" +
        ".r{padding:6mm 4mm}" +
        ".c{text-align:center}" +
        "hr{border:none;border-top:1px dashed #000;margin:5px 0}.dbl{border-top:2px solid #000}" +
        ".big{font-size:" + Math.round(basePx * 1.6) + "px;font-weight:900}" +
        ".huge{font-size:" + Math.round(basePx * 2.4) + "px;font-weight:900;letter-spacing:1px}" +
        ".row{display:flex;justify-content:space-between;align-items:baseline}" +
        ".item{padding:6px 0;border-bottom:1px dashed #000}" +
        ".iname{font-size:" + Math.round(basePx * 1.4) + "px;font-weight:900}" +
        ".iqty{font-size:" + Math.round(basePx * 2) + "px;font-weight:900;text-align:right}" +
        ".pagecut{page-break-after:always}" +
        "</style></head><body><div class='r'>" +
          "<div class='c big'>KITCHEN</div>" +
          (branchName ? "<div class='c'>" + esc(branchName) + "</div>" : "") +
          "<hr class='dbl'/>" +
          "<div class='c huge'>#" + esc(order.orderNo || "") + "</div>" +
          "<hr/>" +
          "<div class='row'><span>Type</span><span>" + esc(order.orderType === "pickup" ? "Pickup" : "Delivery") + "</span></div>" +
          "<div class='row'><span>Placed</span><span>" + esc(when) + "</span></div>" +
          "<div class='row'><span>Ready</span><span>" + esc(readyBy) + " (~" + prepMin + " min)</span></div>" +
          "<hr class='dbl'/>" +
          items +
          (order.note ? "<div style='margin-top:6px'><b>NOTE:</b> " + esc(order.note) + "</div>" : "") +
          "<div style='height:" + (Math.max(1, Number(C.feedLines) || 3) * 4) + "mm'></div>" +
        "</div><div class='pagecut'></div></body></html>";
    }

    // ── QR → SVG (for HTML fallback path) ───────────────────
    // The thermal ESC/POS path lets the printer's firmware raster the QR;
    // the Windows-driver fallback goes through the browser's print pipeline,
    // so we have to embed the QR as an image. qrcode-generator (loaded from
    // jsdelivr in <head>) gives us an inline SVG string with zero external
    // requests — critical because the print iframe may fire while offline.
    function qrSVG(data, size) {
      if (!data) return "";
      if (typeof window.qrcode !== "function") return "";
      try {
        var q = window.qrcode(0, "M");
        q.addData(String(data));
        q.make();
        return q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      } catch (_) { return ""; }
    }

    // ── Browser fallback (Windows manual driver) ────────────
    // Same data as thermal path, laid out at ~80mm width. The Windows
    // thermal-printer driver handles the paper cut once "auto-cut after job"
    // is on in its Preferences pane (standard EPSON/Xprinter/Bixolon default).
    function buildReceiptHTML(order, cfgOverride) {
      var C = resolveConfig(order.branch, cfgOverride);
      var branchMap = { kakkiyah: "Kakkiyah", subhani: "Subhani", waliy: "Waliy Al Ahd" };
      var branchName = branchMap[order.branch] || (order.branchObj && (order.branchObj.nameEn || order.branchObj.id)) || order.branch || "";
      var branchPhone = (order.branchObj && order.branchObj.phone) || "";
      var d = null;
      if (order.createdAt && typeof order.createdAt.toDate === "function") d = order.createdAt.toDate();
      else if (order.date) { var _t = new Date(order.date); if (!isNaN(_t.getTime())) d = _t; }
      if (!d) d = new Date();
      var when = d.toLocaleDateString("en-GB") + " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      var prepMin = order.orderType === "delivery" ? Number(C.prepMinutesDelivery) || 30 : Number(C.prepMinutesPickup) || 15;
      var readyBy = new Date(d.getTime() + prepMin * 60000).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
      var total = Number(order.total) || 0;
      var basePts;
      if (C.loyaltyPerRule && typeof C.loyaltyPerRule === "object") {
        basePts = total >= 500 ? (C.loyaltyPerRule.over500 || 35)
                : total >= 250 ? (C.loyaltyPerRule.over250 || 20)
                : total >= 100 ? (C.loyaltyPerRule.over100 || 10)
                : (C.loyaltyPerRule.base || 5);
      } else {
        basePts = total >= 500 ? 35 : total >= 250 ? 20 : total >= 100 ? 10 : 5;
      }
      var tierMult = Number(order.loyaltyTierMult) > 0 ? Number(order.loyaltyTierMult) : 1;
      var pts = Math.round(basePts * tierMult);
      function esc(s){ return stripEmoji(String(s == null ? "" : s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

      // Same style engine as the ESC/POS path — CSS class picked from
      // C.size<Section> + C.bold<Section> + C.italic<Section>. Every
      // section span is emitted via cls(name) so the admin's slider
      // changes land on-paper without touching this file.
      var basePx = Math.max(9, Math.min(30, Number(C.fontHtmlPx) || 15));
      var SIZE_MAP = { small: 0.85, normal: 1.0, tall: 1.2, big: 1.5, huge: 2.0 };
      function pxFor(size) { return Math.round((SIZE_MAP[String(size||"normal").toLowerCase()] || 1) * basePx); }
      function cls(section) {
        var sz = pxFor(C["size" + section]);
        var bold = C["bold" + section] === true;
        var italic = C["italic" + section] === true;
        return " style=\"font-size:" + sz + "px;font-weight:" + (bold ? 900 : 700) + ";font-style:" + (italic ? "italic" : "normal") + "\"";
      }
      // Convenience — a full <span> wrapping a section's text.
      function s(section, text) { return "<span" + cls(section) + ">" + text + "</span>"; }
      var qrWidthMm = Math.max(20, Math.min(70, Number(C.qrHtmlWidthMm) || 44));

      var itemRows = (order.items || []).map(function(it){
        var qty = it.qty || 1;
        var lineTotal = (typeof it.lineTotal === "number") ? it.lineTotal : (it.price || 0) * qty;
        var right = "SR " + Number(lineTotal).toFixed(2);
        var arLine = (C.showItemArabic && it.nameAr) ? "<div style='font-size:" + Math.round(basePx*0.85) + "px'>" + esc(it.nameAr) + "</div>" : "";
        var noteHTML = it.note ? "<div" + cls("ItemNote") + ">&gt;&gt; " + esc(it.note) + "</div>" : "";
        return "<tr>" +
          "<td class='n'>" + s("ItemName", esc(it.name || "")) + arLine + "<div" + cls("ItemQty") + ">x" + qty + "</div>" + noteHTML + "</td>" +
          "<td class='p'>" + s("ItemPrice", esc(right)) + "</td>" +
          "</tr>";
      }).join("");

      var contactHTML = (C.showBranchPhones ? (C.contactLines || []).filter(Boolean).map(function(l){ return "<div" + cls("Contact") + ">" + esc(l) + "</div>"; }).join("") : "");

      // Reward / coupon QR — inline SVG so no network request is needed.
      // Width honors qrHtmlWidthMm so the admin can shrink or grow it.
      var qrPayload = "", qrLabel = "", qrHeading = "";
      if (order.reward && order.reward.code) {
        qrHeading = "REWARD CODE";
        qrPayload = String(order.reward.code);
        qrLabel   = order.reward.label ? String(order.reward.label) : "Scan to redeem";
      } else if (order.couponCode) {
        qrHeading = "COUPON";
        qrPayload = String(order.couponCode);
        qrLabel   = "Scan to apply";
      }
      var qrHTML = "";
      if (qrPayload) {
        var svg = qrSVG(qrPayload, 180);
        qrHTML = "<div class='c' style='margin-top:6px'>" + s("Labels", esc(qrHeading)) + "</div>" +
                 "<div class='c qrbox' style='width:" + qrWidthMm + "mm'>" + (svg || "") + "</div>" +
                 "<div class='c'>" + s("Reward", esc(qrPayload)) + "</div>" +
                 "<div class='c' style='font-size:" + Math.round(basePx*0.85) + "px'>" + esc(qrLabel) + "</div><hr/>";
      }
      // Per-customer QR — always printed alongside the loyalty block when
      // the order carries a phone, so the counter can scan the ticket to
      // pull up the correct account.
      var custQrHTML = "";
      if (order.userPhone) {
        var custSvg = qrSVG("cust:" + String(order.userPhone), 160);
        if (custSvg) {
          var custWidth = Math.max(20, qrWidthMm - 8);
          custQrHTML = "<div class='c qrbox' style='width:" + custWidth + "mm'>" + custSvg + "</div>" +
                       "<div class='c' style='font-size:" + Math.round(basePx*0.85) + "px'>" + esc(order.userPhone) + "</div>";
        }
      }

      // Receipt-style monospace matches the thermal printer's bitmap font.
      // VT323 gives the unmistakable receipt look; Courier Prime / New /
      // Consolas step in when the Google Fonts request fails (offline).
      return "<!doctype html><html><head><meta charset='utf-8'/><title>Receipt #" + esc(order.orderNo) + "</title>" +
        "<link rel='preconnect' href='https://fonts.googleapis.com'/>" +
        "<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin/>" +
        "<link href='https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:wght@400;700&display=swap' rel='stylesheet'/>" +
        "<style>" +
        "@page{size:72mm auto;margin:0}" +
        "html,body{margin:0;padding:0;background:#fff;color:#000;font-family:'VT323','Courier Prime','Courier New','Consolas',monospace;font-size:" + basePx + "px;line-height:1.15;width:72mm;font-weight:700;-webkit-font-smoothing:none;font-smooth:never}" +
        ".r{padding:6mm 4mm}" +
        ".c{text-align:center}" +
        "hr{border:none;border-top:1px dashed #000;margin:5px 0}.dbl{border-top:2px solid #000}" +
        "table{width:100%;border-collapse:collapse}td{vertical-align:top;padding:2px 0}" +
        ".n{width:70%}.p{width:30%;text-align:right;white-space:nowrap}" +
        ".row{display:flex;justify-content:space-between;align-items:baseline}" +
        ".qrbox{margin:4px auto}.qrbox svg{width:100%;height:auto;display:block}" +
        ".pagecut{page-break-after:always}" +
        "</style></head><body><div class='r'>" +
          "<div class='c'>" + s("Header", esc((C.header || "").toUpperCase())) + "</div>" +
          (C.tagline ? "<div class='c'>" + s("Tagline", esc(C.tagline)) + "</div>" : "") +
          (C.showBranchName && branchName ? "<div class='c'>" + s("BranchName", esc(branchName + (C.branchSuffix || ""))) + "</div>" : "") +
          (C.showBranchContact && branchPhone ? "<div class='c' style='font-size:" + Math.round(basePx*0.85) + "px'>Tel " + esc(branchPhone) + "</div>" : "") +
          "<hr class='dbl'/>" +
          (C.showOrderNo ? "<div class='c'>" + s("OrderNo", "#" + esc(order.orderNo)) + "</div>" : "") +
          (C.showType ? "<div class='row'>" + s("Labels", "Type") + "<span>" + esc(order.orderType === "pickup" ? "Pickup" : "Delivery") + "</span></div>" : "") +
          (C.showStatus && order.status ? "<div class='row'>" + s("Labels", "Status") + "<span>" + esc(order.status) + "</span></div>" : "") +
          (C.showDate ? "<div class='row'>" + s("Labels", "Placed") + "<span>" + esc(when) + "</span></div>" : "") +
          (C.showReadyBy ? "<div class='row'>" + s("Labels", "Ready") + "<span>" + esc(readyBy) + " (~" + prepMin + " min)</span></div>" : "") +
          (order.pickupTime ? "<div class='row'>" + s("Labels", "Pickup") + "<span>" + esc(order.pickupTime) + "</span></div>" : "") +
          "<hr/>" +
          (C.showCustomer ? "<div>" + s("Labels", "Customer") + "</div>" +
            "<div class='c'>" + s("CustomerName", esc(order.userName || "Customer")) + "</div>" +
            (C.showPhone && order.userPhone ? "<div class='row'>" + s("Labels", "Phone") + "<span>" + esc(order.userPhone) + "</span></div>" : "") +
            (C.showPayment ? "<div class='row'>" + s("Labels", "Pay") + "<span>" + esc(order.paymentMethod || "cash") + "</span></div>" : "") +
            (C.showLocation && order.orderType === "delivery" && order.locationLink ? "<div style='font-size:" + Math.round(basePx*0.85) + "px'>" + esc(order.locationLink) + "</div>" : "") +
            "<hr/>" : "") +
          (C.showItems ? "<div class='c'>" + s("Labels", "ITEMS") + "</div><hr/><table>" + itemRows + "</table><hr/>" +
            (order.subtotal != null ? "<div class='row'><span>Subtotal</span><span>SR " + Number(order.subtotal).toFixed(2) + "</span></div>" : "") +
            (order.platformFee ? "<div class='row'><span>Platform Fee</span><span>SR " + Number(order.platformFee).toFixed(2) + "</span></div>" : "") +
            (order.deliveryFee ? "<div class='row'><span>Delivery Fee</span><span>SR " + Number(order.deliveryFee).toFixed(2) + "</span></div>" : "") +
            (order.discount ? "<div class='row'><span>Discount</span><span>-SR " + Number(order.discount).toFixed(2) + "</span></div>" : "") +
            (order.couponCode ? "<div class='row'><span>Coupon</span><span>" + esc(order.couponCode) + "</span></div>" : "") +
            "<div class='row'>" + s("TotalLabel", "TOTAL") + s("TotalLabel", "SR " + total.toFixed(2)) + "</div>" +
            "<div class='c' style='font-size:" + Math.round(basePx*0.85) + "px'>(Prices incl. 15% VAT: SR " + (order.vat || Math.round(total / 1.15 * 0.15 * 100) / 100).toFixed(2) + ")</div><hr class='dbl'/>" : "") +
          (order.note ? "<div>" + s("Labels", "Note:") + " <span" + cls("ItemNote") + ">" + esc(order.note) + "</span></div><hr/>" : "") +
          qrHTML +
          (C.showLoyalty ? "<div class='c'>" + s("Labels", esc(C.loyaltyLabel || "Loyalty Points")) + "</div>" +
            (order.loyaltyTierName ? "<div class='c'>Tier: " + esc(order.loyaltyTierName) + (tierMult && tierMult !== 1 ? " (x" + tierMult + ")" : "") + "</div>" : "") +
            "<div class='c'>Earned this order: +" + pts + " pts</div>" +
            (C.showLoyaltyBalance && order.loyaltyBalance != null ? "<div class='c'>Total balance: " + Number(order.loyaltyBalance) + " pts</div>" : "") +
            custQrHTML +
            "<hr/>" : "") +
          ((C.showTaxNumber && C.taxNumber) ? "<div class='row'>" + s("Labels", "Tax#") + "<span>" + esc(C.taxNumber) + "</span></div>" : "") +
          ((C.showVatNumber && C.vatNumber) ? "<div class='row'>" + s("Labels", "VAT#") + "<span>" + esc(C.vatNumber) + "</span></div>" : "") +
          (contactHTML ? "<div class='c' style='margin-top:6px'>" + s("Labels", esc(C.contactHeader || "Contact Us")) + "</div><div class='c'>" + contactHTML + "</div><hr class='dbl'/>" : "") +
          (C.promoLine ? "<div class='c'><span style='font-style:" + (C.italicPromo ? "italic" : "normal") + "'>" + esc(C.promoLine) + "</span></div><hr/>" : "") +
          (C.footerLine1 ? "<div class='c'>" + s("Footer", esc(C.footerLine1)) + "</div>" : "") +
          (C.footerLine2 ? "<div class='c'>" + s("Footer", esc(C.footerLine2)) + "</div>" : "") +
          (C.footerLine3 ? "<div class='c'>" + s("Footer", esc(C.footerLine3)) + "</div>" : "") +
          "<div style='height:" + (Math.max(1, Number(C.feedLines) || 3) * 4) + "mm'></div>" +
        "</div><div class='pagecut'></div></body></html>";
    }

    // Print the HTML receipt through the browser's native print pipeline.
    // Works on any Windows machine that has the thermal printer installed as
    // a normal Windows printer — no QZ Tray required.
    function browserPrint(order) {
      return enrichOrder(order).then(function (enriched) {
        return new Promise(function (resolve) {
          var f = document.createElement("iframe");
          f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
          document.body.appendChild(f);
          var html = buildReceiptHTML(enriched);
          try {
            f.contentDocument.open();
            f.contentDocument.write(html);
            f.contentDocument.close();
          } catch (e) { resolve(false); return; }
          setTimeout(function () {
            try {
              f.contentWindow.focus();
              f.contentWindow.print();
            } catch (e) {}
            setTimeout(function () { try { f.remove(); } catch (_) {} resolve(true); }, 1500);
          }, 400);
        });
      });
    }

    // Fetches the customer's running loyalty balance so it prints on the
    // ticket. Best-effort — a lookup failure just skips that line. Also
    // caches the branch snapshot's phone if the order didn't embed one.
    function enrichOrder(order) {
      var enriched = Object.assign({}, order);
      if (!window.FB || !order.userPhone) return Promise.resolve(enriched);
      var fn = window.FB.getLoyaltySnapshotByPhone;
      if (typeof fn !== "function") {
        // Legacy path — single doc, single field. Kept so an old cached
        // fb.js still shows *something* rather than nothing.
        if (!window.FB.getCustomerByPhone) return Promise.resolve(enriched);
        return window.FB.getCustomerByPhone(order.userPhone).then(function (c) {
          if (c && c.loyaltyPoints != null) enriched.loyaltyBalance = Number(c.loyaltyPoints) || 0;
          return enriched;
        }).catch(function () { return enriched; });
      }
      return fn(order.userPhone).then(function (snap) {
        if (snap) {
          enriched.loyaltyBalance = Number(snap.balance) || 0;
          enriched.loyaltyTierMult = Number(snap.tierMult) || 1;
          if (snap.tierName)  enriched.loyaltyTierName  = snap.tierName;
          if (snap.tierEmoji) enriched.loyaltyTierEmoji = snap.tierEmoji;
        }
        return enriched;
      }).catch(function () { return enriched; });
    }

    // ── Send to printer ─────────────────────────────────────
    // Uses ESC/POS raw mode, which QZ Tray sends silently (no OS print dialog).
    // Two independent jobs — customer receipt on the counter printer and
    // (if configured) a kitchen ticket on the kitchen printer. Both dispatch
    // in parallel; a missing/blank kitchen printer just skips its ticket.
    function _sendRaw(target, payload) {
      return qz.printers.find(target).then(function (printer) {
        var actualPrinter = Array.isArray(printer) ? printer[0] : printer;
        if (!actualPrinter) throw new Error("Printer not found: " + target);
        var config = qz.configs.create(actualPrinter, {
          copies: COPIES,
          rasterize: false,
          altPrinting: false
        });
        return qz.print(config, [{ type: "raw", format: "plain", data: payload }]);
      });
    }
    function _doPrint(order) {
      var customerTarget = printerFor(order);
      var kitchenTarget = kitchenPrinterFor(order);
      return enrichOrder(order).then(function (enriched) {
        var jobs = [];
        // Customer receipt (unchanged content)
        if (customerTarget) {
          jobs.push(_sendRaw(customerTarget, buildReceipt(enriched)).catch(function (e) {
            console.warn("Customer receipt failed on " + customerTarget + ":", e && (e.message || e));
            throw e;
          }));
        }
        // Kitchen ticket — only when a kitchen printer is configured for
        // this branch (or globally). Silent skip otherwise so branches that
        // print at the counter aren't forced to configure a kitchen printer.
        if (kitchenTarget) {
          jobs.push(_sendRaw(kitchenTarget, buildKitchenReceipt(enriched)).catch(function (e) {
            // A missing kitchen printer must not stop the customer receipt
            // from being counted as printed. Log + swallow.
            console.warn("Kitchen ticket failed on " + kitchenTarget + ":", e && (e.message || e));
            logPrint({ ok: false, orderNo: enriched.orderNo, fbId: enriched.fbId, printer: kitchenTarget, via: "qz-kitchen", msg: (e && (e.message || e.code)) || String(e) });
          }));
        }
        if (!jobs.length) throw new Error("No printer configured");
        return Promise.all(jobs);
      });
    }
    // Phase 8 hardening:
    //   • persistent dedup — key is added to PRINTED_IDS *before* the print
    //     attempt so a mid-flight page reload doesn't reprint. If the print
    //     ultimately fails we log the failure but keep the dedup — the
    //     operator sees the fail badge in Settings and can hit Reprint
    //     explicitly, which is what they want anyway (avoids the printer
    //     spamming a burst of retries after a hiccup).
    //   • exponential backoff (1s, 3s, 8s) with re-connect between tries.
    //   • Windows-browser fallback only after every QZ attempt has failed.
    //   • every attempt writes a PRINT_LOG entry; the running stats
    //     (ok/fail/fallback + lastFailAt/Msg) power the Settings badge.
    var QZ_RETRY_DELAYS = [1000, 3000, 8000];

    function tryQzOnce(order, attempt) {
      return connect().then(function () { return _doPrint(order); }).then(function () {
        console.log("✅ Printed order #" + order.orderNo + (attempt > 1 ? " (attempt " + attempt + ")" : ""));
        showStatus("✅ Printed #" + order.orderNo, "ok");
        logPrint({ ok: true, orderNo: order.orderNo, fbId: order.fbId, printer: printerFor(order), via: "qz", attempt: attempt });
        return true;
      });
    }

    function printOrder(order) {
      var key = _dedupKey(order);
      // Claim the dedup key up-front so racing callers (the orders listener
      // firing while a manual Reprint is in flight) don't double up.
      PRINTED_IDS.add(key); saveDedup();

      var attempt = 0;
      function attemptQz() {
        attempt += 1;
        return tryQzOnce(order, attempt).catch(function (err) {
          var msg = (err && (err.message || err.code)) || String(err);
          console.warn("QZ print attempt " + attempt + " failed:", msg);
          if (attempt >= QZ_RETRY_DELAYS.length + 1) throw err;
          var delay = QZ_RETRY_DELAYS[attempt - 1];
          return new Promise(function (r) { setTimeout(r, delay); }).then(attemptQz);
        });
      }

      return attemptQz().catch(function (finalErr) {
        var msg = (finalErr && (finalErr.message || finalErr.code)) || String(finalErr);
        // Deliberate no-fallback path — the user asked for direct silent
        // printing only. The old Windows-print fallback opened the OS print
        // dialog, which is exactly what they wanted killed. If QZ can't
        // print (offline, blocked, no printer), we log + show a status and
        // let the operator hit Reprint once the printer is back.
        console.warn("QZ exhausted after " + attempt + " attempts:", msg);
        // Surface the actual error text in the badge — operator needs
        // "Printer not found: PP9000EU" vs "websocket closed" to fix
        // the root cause, not a generic "check QZ Tray".
        var shortMsg = String(msg || "").slice(0, 140);
        showStatus("❌ #" + order.orderNo + ": " + shortMsg, "error");
        logPrint({ ok: false, orderNo: order.orderNo, fbId: order.fbId, printer: printerFor(order), via: "qz", attempts: attempt, msg: msg });
        // Free the dedup slot so a manual Reprint can retry from scratch
        // once the printer/QZ Tray is back.
        PRINTED_IDS.delete(key); saveDedup();
        throw finalErr;
      });
    }

    // Explicit reprint — clears the dedup slot for this order so the retry
    // pipeline runs from scratch. Used by the operator "Reprint" button after
    // a failure or when a ticket physically didn't come out.
    function reprintOrder(order) {
      PRINTED_IDS.delete(_dedupKey(order)); saveDedup();
      return printOrder(order);
    }

    // ── Auto-print hook (called from orders listener) ───────
    // Auto-print now fires only when an order transitions to "preparing"
    // (i.e., after the user pressed Accept). New orders sit as "new"
    // until an operator confirms — no surprise prints, no fake banners.
    function _dedupKey(o) { return o.fbId || o.orderNo || ""; }

    function handleIncomingOrders(orders) {
      if (!AUTO_PRINT) return;

      // On first load, mark every already-known order as printed so
      // reopening the app doesn't re-print history.
      if (FIRST_LOAD) {
        orders.forEach(function (o) { PRINTED_IDS.add(_dedupKey(o)); });
        FIRST_LOAD = false;
        return;
      }

      orders.filter(function (o) {
        if (o.status !== "preparing") return false;
        if (PRINTED_IDS.has(_dedupKey(o))) return false;
        if (BRANCH_FILTER && BRANCH_FILTER !== "all" && o.branch !== BRANCH_FILTER) return false;
        return true;
      }).forEach(function (o, i) {
        // Stagger prints slightly so bursts don't overwhelm the printer.
        setTimeout(function () { printOrder(o); }, 400 + i * 250);
      });
    }

    // ── Status badge ─────────────────────────────────────────
    function showStatus(msg, level) {
      if (!statusEl) {
        statusEl = document.createElement("div");
        statusEl.id = "qz-status";
        statusEl.style.cssText = [
          "position:fixed;top:16px;right:16px;z-index:9999",
          "padding:8px 14px;border-radius:20px;font-size:12px;font-weight:600",
          "font-family:Poppins,sans-serif;pointer-events:none",
          "transition:opacity 0.3s;opacity:0"
        ].join(";");
        document.body.appendChild(statusEl);
      }
      var colors = {
        ok:    { bg:"#001a0a", border:"#00D26A", color:"#00D26A" },
        warn:  { bg:"#FFFBEB", border:"#FDE68A", color:"#D97706" },
        error: { bg:"#1a0000", border:"#E60000", color:"#E60000" }
      };
      var c = colors[level] || colors.warn;
      statusEl.style.background = c.bg;
      statusEl.style.border = "1px solid " + c.border;
      statusEl.style.color = c.color;
      statusEl.textContent = msg;
      statusEl.style.opacity = "1";
      clearTimeout(statusEl._timer);
      // Errors linger so the operator can actually read the QZ message —
      // 12s is enough to snap a photo without being permanently intrusive.
      var stickyMs = level === "error" ? 12000 : 3000;
      statusEl._timer = setTimeout(function () { statusEl.style.opacity = "0"; }, stickyMs);
    }

    // ── Persistent printer status bar (disabled) ────────────
    // The always-on strip cluttered the bottom of every screen and was
    // especially noisy when QZ Tray wasn't installed. Kept the helpers as
    // no-ops so updateBar() call sites don't need conditional guards;
    // printer state lives in Settings → Printer Setup instead.
    var barEl = null;

    function createStatusBar() {
      // Intentionally empty — no floating bar.
      return;
      updateBar("connecting", "");
    }

    // ── Printer Settings modal ──────────────────────────────
    function openSettings() {
      var existing = document.getElementById("qz-settings");
      if (existing) { existing.remove(); return; }
      var wrap = document.createElement("div");
      wrap.id = "qz-settings";
      wrap.style.cssText = "position:fixed;inset:0;background:rgba(16,24,40,0.55);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:Plus Jakarta Sans,sans-serif";
      wrap.addEventListener("click", function(e){ if (e.target === wrap) wrap.remove(); });

      function row(label, key, ph) {
        var val = key === "default" ? PRINTER_NAME : (PRINTER_MAP[key] || "");
        return "<div style='margin-bottom:10px'>" +
               "<label style='display:block;font-size:11px;color:#6B7280;margin-bottom:4px;font-weight:600'>" + label + "</label>" +
               "<input data-key='" + key + "' value='" + val.replace(/'/g,"&#39;") + "' placeholder='" + ph + "' " +
               "style='width:100%;padding:9px 11px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;outline:none' />" +
               "</div>";
      }

      wrap.innerHTML = "<div style='background:#fff;border-radius:16px;width:min(420px,92vw);padding:22px;box-shadow:0 20px 60px rgba(16,24,40,0.25)'>" +
        "<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:14px'>" +
          "<div style='font-size:16px;font-weight:800;color:#111827'>🖨️ Printer Settings</div>" +
          "<button id='qz-close' style='border:none;background:#F3F4F6;width:28px;height:28px;border-radius:8px;cursor:pointer;font-weight:700'>×</button>" +
        "</div>" +
        row("Default printer (fallback)", "default", "e.g. PP9000EU") +
        row("Kakkiyah branch printer", "kakkiyah", "leave blank to use default") +
        row("Subhani branch printer",  "subhani",  "leave blank to use default") +
        row("Waliy Al Ahd branch printer", "waliy", "leave blank to use default") +
        "<div style='display:flex;gap:12px;margin:6px 0 14px'>" +
          "<div style='flex:1'>" +
            "<label style='display:block;font-size:11px;color:#6B7280;margin-bottom:4px;font-weight:600'>Copies</label>" +
            "<input id='qz-copies' type='number' min='1' max='9' value='" + COPIES + "' " +
            "style='width:100%;padding:9px 11px;border:1px solid #E5E7EB;border-radius:8px;font-size:13px;outline:none' />" +
          "</div>" +
          "<div style='flex:1;display:flex;align-items:end'>" +
            "<label style='display:flex;align-items:center;gap:8px;font-size:13px;color:#111827;font-weight:600;cursor:pointer'>" +
              "<input id='qz-auto' type='checkbox' " + (AUTO_PRINT ? "checked" : "") + " /> Auto-print new orders" +
            "</label>" +
          "</div>" +
        "</div>" +
        "<div style='display:flex;gap:8px'>" +
          "<button id='qz-test' style='flex:1;padding:11px;border:1px solid #FED7AA;background:#FFF7ED;color:#EA580C;font-weight:700;border-radius:10px;cursor:pointer;font-size:13px'>🖨️ Test print</button>" +
          "<button id='qz-save' style='flex:1;padding:11px;border:none;background:#E60000;color:#fff;font-weight:800;border-radius:10px;cursor:pointer;font-size:13px'>Save</button>" +
        "</div>" +
        "<div style='margin-top:12px;font-size:11px;color:#9CA3AF;line-height:1.5'>Printer names must match exactly what QZ Tray sees. Silent raw ESC/POS mode (no OS dialog).</div>" +
      "</div>";
      document.body.appendChild(wrap);
      wrap.querySelector("#qz-close").onclick = function(){ wrap.remove(); };
      wrap.querySelector("#qz-save").onclick = function(){
        var inputs = wrap.querySelectorAll("input[data-key]");
        inputs.forEach(function(i){
          var k = i.getAttribute("data-key"); var v = (i.value||"").trim();
          if (k === "default") PRINTER_NAME = v || "PP9000EU";
          else { if (v) PRINTER_MAP[k] = v; else delete PRINTER_MAP[k]; }
        });
        COPIES = Math.max(1, parseInt(wrap.querySelector("#qz-copies").value,10)||1);
        AUTO_PRINT = wrap.querySelector("#qz-auto").checked;
        saveCfg();
        showStatus("✅ Printer settings saved", "ok");
        wrap.remove();
      };
      wrap.querySelector("#qz-test").onclick = function(){
        var sample = {
          orderNo: "TEST", branch: BRANCH_FILTER && BRANCH_FILTER !== "all" ? BRANCH_FILTER : "kakkiyah",
          orderType: "pickup", paymentMethod: "cash",
          userName: "Test Print", userPhone: "0500000000",
          items: [{ emoji: "🍗", name: "Test Item", qty: 1, price: 10 }],
          total: 10
        };
        printOrder(sample);
      };
    }

    function updateBar(state, printerName) {
      if (!barEl) return;
      var dot, label, color;
      if (state === "connected") {
        dot = "●"; color = "#00D26A";
        label = "<span style='color:#00D26A;font-weight:700'>● QZ Tray Connected</span>" +
                "&nbsp;&nbsp;|&nbsp;&nbsp;" +
                "<span style='color:#FFC400'>🖨️ " + printerName + "</span>" +
                "&nbsp;&nbsp;|&nbsp;&nbsp;" +
                "<span style='color:#9A9A9A'>Auto-print: " + (AUTO_PRINT ? "ON" : "OFF") + "</span>" +
                "&nbsp;&nbsp;|&nbsp;&nbsp;" +
                "<span style='color:#6B7280;text-decoration:underline'>⚙ Configure</span>";
      } else if (state === "offline") {
        label = "<span style='color:#E60000;font-weight:700'>● QZ Tray Offline</span>" +
                "&nbsp;&nbsp;|&nbsp;&nbsp;" +
                "<span style='color:#555'>Start QZ Tray app to enable printing</span>";
      } else {
        label = "<span style='color:#FFC400'>● Connecting to QZ Tray...</span>";
      }
      barEl.innerHTML = "<span style='font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#9CA3AF'>PRINTER</span>&nbsp;&nbsp;" + label;
    }

    // ── Init: connect on load ────────────────────────────────
    window.addEventListener("load", function () {
      createStatusBar();
      setTimeout(function () {
        if (typeof qz === "undefined") { updateBar("offline", ""); return; }

        installQzSecurity();

        var doConnect = function () {
          if (qz.websocket.isActive()) {
            // already connected, just find printer
            qz.printers.find(PRINTER_NAME || "").then(function (p) {
              var name = Array.isArray(p) ? p[0] : p;
              updateBar("connected", name || PRINTER_NAME || "Default Printer");
            }).catch(function () {
              updateBar("connected", PRINTER_NAME || "Default Printer");
            });
            return;
          }
          qz.websocket.connect().then(function () {
            return qz.printers.find(PRINTER_NAME || "");
          }).then(function (p) {
            var name = Array.isArray(p) ? p[0] : p;
            updateBar("connected", name || PRINTER_NAME || "Default Printer");
            showStatus("🖨️ Printer ready", "ok");
          }).catch(function () {
            updateBar("offline", "");
          });
        };

        doConnect();

        // Re-check every 5 seconds in case QZ Tray starts later
        setInterval(function () {
          if (!qz.websocket.isActive()) {
            updateBar("offline", "");
            doConnect();
          }
        }, 5000);
      }, 1200);
    });

    // ── Patch Firebase onOrdersChange to trigger auto-print ──
    var _origFBReady = setInterval(function () {
      if (!window.FB) return;
      clearInterval(_origFBReady);
      var _orig = window.FB.onOrdersChange;
      window.FB.onOrdersChange = function (cb) {
        return _orig.call(window.FB, function (orders) {
          // Pass the FULL order through to the print pipeline. The earlier
          // trimmed projection dropped couponCode / reward / totals /
          // subtotal / refund / branchObj / pickupTime / note / overrides /
          // loyaltyBalance — so auto-printed receipts lost the QR block
          // and the itemized totals block that manual reprints get.
          // Just top up the two fields the print module absolutely needs
          // sensible defaults for, then hand the full doc down.
          handleIncomingOrders(orders.map(function(o){
            return Object.assign({}, o, {
              orderNo: o.orderNo || (o.fbId ? o.fbId.slice(-4) : "0000"),
              status: o.status || "new",
            });
          }));
          cb(orders);
        });
      };
      console.log("🖨️ Thermal print module ready");
    }, 300);

    // ── Public API ───────────────────────────────────────────
    return {
      connect: connect,
      print: printOrder,
      reprint: reprintOrder,
      openSettings: openSettings,
      setAutoPrint: function (v) { AUTO_PRINT = !!v; saveCfg(); },
      setPrinterName: function (n) { PRINTER_NAME = n || "PP9000EU"; saveCfg(); },
      setBranchPrinter: function (branch, name) {
        if (!branch) return;
        if (name) PRINTER_MAP[branch] = name; else delete PRINTER_MAP[branch];
        saveCfg();
      },
      setKitchenPrinterName: function (n) { KITCHEN_PRINTER_NAME = n || ""; saveCfg(); },
      setKitchenBranchPrinter: function (branch, name) {
        if (!branch) return;
        if (name) KITCHEN_PRINTER_MAP[branch] = name; else delete KITCHEN_PRINTER_MAP[branch];
        saveCfg();
      },
      setCopies: function (n) { COPIES = Math.max(1, parseInt(n,10)||1); saveCfg(); },
      setBranchFilter: function (b) { BRANCH_FILTER = b; console.log("🖨️ Print filter set to branch: " + b); },
      getStatus: function () { return qz && qz.websocket.isActive(); },
      getConfig: function () { return { printerName: PRINTER_NAME, copies: COPIES, autoPrint: AUTO_PRINT, printerMap: Object.assign({}, PRINTER_MAP), kitchenPrinterName: KITCHEN_PRINTER_NAME, kitchenPrinterMap: Object.assign({}, KITCHEN_PRINTER_MAP) }; },
      // Live-preview helpers — return HTML the InvoiceSetup pane renders
      // in an iframe so the admin sees pending edits before Save.
      renderCustomerHTML: function (order, cfgOverride) { return buildReceiptHTML(order || {}, cfgOverride); },
      renderKitchenHTML:  function (order, cfgOverride) { return buildKitchenReceiptHTML(order || {}, cfgOverride); },
      // Certificate export — QZ Tray Community edition only lets
      // "Remember this decision" persist for certificates installed as
      // override.crt in QZ's config folder. This helper triggers a
      // browser download of that file so the operator can drop it into
      // %APPDATA%\qz\override.crt (Windows) / ~/Library/Application
      // Support/qz/override.crt (Mac) / ~/.qz/override.crt (Linux) and
      // restart QZ Tray. After that every print is silent — no prompt
      // at all.
      downloadCertificate: function () {
        try {
          var blob = new Blob([QZ_CERT_PEM + "\n"], { type: "application/x-x509-ca-cert" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "override.crt";
          document.body.appendChild(a); a.click();
          setTimeout(function () { try { a.remove(); URL.revokeObjectURL(url); } catch (_) {} }, 500);
          return true;
        } catch (e) { console.warn("cert download failed:", e); return false; }
      },
      getCertificatePEM: function () { return QZ_CERT_PEM; },
      // Pre-claim a dedup key so the Firestore listener's auto-print hook
      // won't race with an explicit Accept-triggered print. Persistent.
      markPrinted: function (order) { if (order) { PRINTED_IDS.add(_dedupKey(order)); saveDedup(); } },
      isPrinted: function (order) { return order ? PRINTED_IDS.has(_dedupKey(order)) : false; },
      // Phase 8: reliability telemetry for the Settings panel.
      getStats: function () { return Object.assign({}, PRINT_STATS); },
      getLog: function (n) { var arr = PRINT_LOG.slice(-(n||50)); return arr.slice().reverse(); },
      clearFailures: function () { PRINT_STATS.fail = 0; PRINT_STATS.lastFailAt = null; PRINT_STATS.lastFailMsg = null; saveStats(); },
      // Invoice template overrides. Called by the app after loading Firestore
      // config, and every time it changes via onSnapshot.
      setInvoiceConfig: function (cfg) { setInvoiceConfig(cfg); },
      getInvoiceDefaults: function () { return Object.assign({}, INVOICE_DEFAULTS); },
      // Manual browser-only print — for testing the Windows fallback path.
      browserPrint: function (order) { return browserPrint(order); },
      // Customer 360° panel calls this to reprint a past order silently.
      reprintOrder: function (order) { return reprintOrder(order); },
      printOrder:   function (order) { return printOrder(order); }
    };
  })();
  </script>
